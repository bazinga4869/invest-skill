project:
  name: invest-skill
  version: 0.7.0
  # 留空 = 取系统当天（日常/cron 必须如此）；仅历史回测时钉日期，如 '2026-07-20'
  analysis_date:
paths:
  # 运行时根：DB/日志/报告/状态文件都落在该目录下，不回写 skill 仓库。
  # 优先级：环境变量 INVEST_SKILL_HOME > 本项（绝对路径）> skill 仓库（向后兼容）。
  # skill 被任意项目调用时，由调用方设置 INVEST_SKILL_HOME 指向自己的运行时目录。
  runtime_root:
  data_dir: ./data
  reports_dir: ./reports
  invest_tool_dir: ./reports/invest_tool
  ai_berkshire_dir: ./reports/ai_berkshire
  db_file: ./data/invest_skill.db
  schema_file: ./schema.sql
report_wiki:
  repo_path: ../invest-report-wiki
  cli_path: ../invest-report-wiki/bin/report-wiki
  materialize_timeout_seconds: 3600
  history_years: 5
  report_types: [annual]
  evidence_only: true
  require_local_search: true
wiki_dependencies:
  repo_path: ../invest-kb  # 知识层：投资知识库 AI-Wiki 的桥接仓（wiki/concepts 为生成物，04_stock-analysis-expert 为面板）
  legacy_contract_repo_path: ../invest-wiki
  query_timeout_seconds: 60
  cache:
    enabled: true
    # 相对路径始终解析到 INVEST_SKILL_HOME，不写回 skill 资产仓库。
    dir: data/sage_wiki_cache
    fresh_days: 7
    max_stale_days: 90
    # 无通过校验缓存时保持 fail-closed；不以测试/builtin 内容伪造 Sage 结果。
    allow_builtin_without_cache: false
  expert_panel:
    base_path: 04_stock-analysis-expert
    schema: 04_stock-analysis-expert/_schema.md
    index: 04_stock-analysis-expert/index.md
    panel: 04_stock-analysis-expert/experts/_panel.md
    process: 04_stock-analysis-expert/process/深度分析流程.md
    experts:
    - path: 04_stock-analysis-expert/experts/01-财务排雷官.md
      role: financial-auditor
      priority: 1
    - path: 04_stock-analysis-expert/experts/02-价值估值师.md
      role: value-valuator
      priority: 2
    - path: 04_stock-analysis-expert/experts/03-成长质量师.md
      role: growth-assessor
      priority: 3
      framework:
      - Fisher
      - Lynch
    - path: 04_stock-analysis-expert/experts/04-护城河分析师.md
      role: moat-analyst
      priority: 4
    - path: 04_stock-analysis-expert/experts/05-认知风控官.md
      role: cognitive-controller
      priority: 5
    - path: 04_stock-analysis-expert/experts/06-宏观周期师.md
      role: macro-cyclist
      priority: 6
    - path: 04_stock-analysis-expert/experts/07-管理层审计师.md
      role: management-auditor
      priority: 7
    adjudicator:
    - path: 04_stock-analysis-expert/adjudicator/裁判长-多框架裁判规则.md
      role: adjudicator
    - path: 04_stock-analysis-expert/adjudicator/案例库-裁判先例.md
      role: case-library
    cache: 04_stock-analysis-expert/_cache.json
  methodology_pages:
  - path: 企业档案/综合报告编写规范.md
    purpose: 报告结构依据
    critical_sections:
    - 二、frontmatter 规范
    - 三、正文结构
    - 四、每章内容规范
  - path: 02_stock_domain/策略研究/价值投资框架.md
    purpose: 估值与筛选框架依据（已逐步由专家团替代）
  - path: 10_meta/未来产业每日筛选计划.md
    purpose: 每日筛选计划与股票池框架
coupling:
  validate_wiki_refs_before_run: true
  drift_report: ./data/wiki_drift_report.json
  block_on_drift: false
  improvement_candidates: ./data/improvement_candidates.json
data_sources:
  tushare:
    token_env: TUSHARE_TOKEN
    primary: true
    fallback: false
  akshare:
    primary: false
    fallback: true
